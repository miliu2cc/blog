# The URL the site will be built for
base_url = "https://blog-7ia.pages.dev" #先用cf域名
title = "我的博客"
description = "记录一些东西。"

theme = "axetrine"
# Whether to automatically compile all Sass files in the sass directory
compile_sass = true
generate_feeds = true
feed_filenames = ["atom.xml"]
build_search_index = false

default_language = "zh-Hans" # 中文站

[languages.en]
title = "My Blog"
description = "Just notes."
build_search_index = true        # 英文可以建索引，中文不行
generate_feeds = true
feed_filenames = ["atom.xml"]


taxonomies = [
    { name = "tags", feed = true },
    { name = "categories", feed = true },
]

[markdown]
smart_punctuation = true     # 中文标点更自然
github_alerts = true

[markdown.highlighting]
theme = "catppuccin-mocha"

[extra]
# Put all your custom variables here
accent_color = "purple"      # 主题色：red/orange/yellow/green/blue/purple，或 "hsl(270, 50%, 60%)"
date_format = "%Y 年 %m 月 %d 日"
date_format_long = "%Y 年 %m 月 %d 日 %R (%Z)"
date_locale = "zh_CN"        # 月份名等本地化
timezone = "Asia/Shanghai"

[extra.en]
date_format = "%b %d, %Y"
date_format_long = "%B %d, %Y, %R (%Z)"
date_locale = "en_US"

[extra.meta]
favicon = false              # 没有 favicon 文件时先关掉，避免用主题默认图标

[extra.nav]
links = [
    { url = "@/blog/_index.md", name = "博客", icon = "newspaper" },
    # 以后可以继续加：
    # { url = "https://github.com/yourname", name = "GitHub", icon = "github-logo" },
]

[extra.nav.en]
links = [
    { url = "@/blog/_index.md", name = "Blog", icon = "newspaper" },
]

[extra.footer]
copyright = "© $YEAR 我的博客"   # $YEAR 会自动替换成当前年份
show_powered_by = true
socials = [
    { url = "https://github.com/yourname", icon = "github" },
]

[extra.footer.en]
copyright = "© $YEAR My Blog"
